name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Placeholder at the root; draft site for client review at /test/, kept out of search engines.
      - name: Assemble site
        run: |
          mkdir -p _site/test
          cp -R under-construction/. _site/
          cp -R site/. _site/test/
          find _site/test -name '*.html' -exec sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex, nofollow">|' {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
