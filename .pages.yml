# Pages CMS (https://pagescms.org): what the client can edit after signing in.
# Field names must match src/lib/content.ts; icon values must match src/components/ServiceIcon.tsx.

media:
  input: public/uploads
  output: /uploads
  categories: [image]
  rename: safe

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, year]
      sort: order
      order: asc
    fields:
      - name: title
        label: Project name
        type: string
        required: true
      - name: category
        label: Type of work
        type: string
        description: e.g. Renovation, Addition, Roofing
      - name: location
        label: Town
        type: string
      - name: year
        label: Year
        type: number
      - name: layout
        label: Page layout
        type: select
        options:
          values:
            - { name: carousel, label: Photo slider }
            - { name: wide, label: One wide photo }
            - { name: side, label: Photo beside the details }
      - name: client
        label: Client
        type: string
        description: Optional, e.g. Private homeowner.
      - name: link
        label: Link (shown as Visit)
        type: string
        description: Optional web address.
      - name: order
        label: Position on the home page
        type: number
        description: Lower numbers show first.
      - name: cover
        label: Cover photo (shown on the home page)
        type: image
      - name: photos
        label: Project photos
        type: image
        options:
          multiple:
            max: 20
      - name: description
        label: Description
        type: text
        description: Leave a blank line between paragraphs.

  - name: home
    label: Home page
    type: file
    path: content/home.json
    format: json
    fields:
      - name: hero
        label: Top of the page
        type: object
        fields:
          - name: headline
            label: Headline (first part)
            type: string
          - name: headlineEmphasis
            label: Headline (bold part)
            type: string
          - name: subheading
            label: Tagline
            type: text
          - name: buttonLabel
            label: Button text
            type: string
          - name: buttonAction
            label: Button action
            type: select
            options:
              values:
                - name: quote
                  label: Go to the quote form
                - name: call
                  label: Call the phone number
          - name: image
            label: Photo
            type: image
      - name: services
        label: Services
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro line
            type: string
          - name: items
            label: Services
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Service
                type: string
              - name: description
                label: Description
                type: text
              - name: icon
                label: Icon
                type: select
                options:
                  values:
                    - { name: house, label: House }
                    - { name: ruler, label: Ruler }
                    - { name: bath, label: Bath }
                    - { name: hard-hat, label: Hard hat }
                    - { name: shovel, label: Shovel }
                    - { name: building, label: Building }
                    - { name: hammer, label: Hammer }
                    - { name: paint-roller, label: Paint roller }
                    - { name: wrench, label: Wrench }
                    - { name: drill, label: Drill }
      - name: portfolio
        label: Our work section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro line
            type: string
      - name: about
        label: About section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro line
            type: string
          - name: story
            label: Our story
            type: text
            description: Leave a blank line between paragraphs.
          - name: image
            label: Photo
            type: image
          - name: yearsInBusiness
            label: Years in business
            type: number
            description: Set to 0 to hide the box.
          - name: credentials
            label: Licences, insurance and memberships
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
              - name: detail
                label: Detail
                type: string
              - name: year
                label: Year or status
                type: string
      - name: stats
        label: By the numbers (percentage rings)
        type: object
        fields:
          - name: show
            label: Show this section
            type: boolean
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro line
            type: string
          - name: items
            label: Figures
            type: object
            list:
              max: 4
              collapsible:
                collapsed: true
                summary: "{label} ({percent}%)"
            fields:
              - name: label
                label: Label
                type: string
              - name: percent
                label: Percentage (0–100)
                type: number
      - name: testimonials
        label: Testimonials
        type: object
        fields:
          - name: show
            label: Show this section
            type: boolean
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro line
            type: string
          - name: items
            label: Reviews
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Client name
                type: string
              - name: role
                label: Project or town
                type: string
              - name: quote
                label: What they said
                type: text
              - name: photo
                label: Photo
                type: image
      - name: news
        label: News
        type: object
        fields:
          - name: show
            label: Show this section
            type: boolean
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro line
            type: string
          - name: items
            label: Posts
            type: object
            list:
              max: 4
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
              - name: date
                label: Date
                type: date
              - name: author
                label: Author
                type: string
              - name: category
                label: Category
                type: string
              - name: image
                label: Photo
                type: image
              - name: link
                label: Link (optional)
                type: string
      - name: contact
        label: Contact section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro line
            type: string

  - name: site
    label: Business details
    type: file
    path: content/site.json
    format: json
    fields:
      - name: companyName
        label: Company name
        type: string
        required: true
      - name: logoText
        label: Logo text (top left)
        type: string
      - name: phone
        label: Phone
        type: string
      - name: email
        label: Email
        type: string
      - name: address
        label: Address or area
        type: string
      - name: showAddressOnMap
        label: Show a map of this address
        type: boolean
      - name: hours
        label: Business hours
        type: string
      - name: serviceAreas
        label: Areas you serve
        type: string
        list: true
      - name: social
        label: Social and review links
        type: object
        fields:
          - name: facebook
            label: Facebook page link
            type: string
          - name: instagram
            label: Instagram link
            type: string
          - name: google
            label: Google Business Profile link
            type: string
      - name: seo
        label: Search results
        type: object
        fields:
          - name: title
            label: Title shown in Google
            type: string
          - name: description
            label: Description shown in Google
            type: text
